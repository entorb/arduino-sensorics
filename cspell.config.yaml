---
$schema: https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json
version: '0.2'
useCache: true
useGitignore: true
dictionaryDefinitions:
  - name: cspell-words
    path: cspell-words.txt
    addWords: true
dictionaries:
  - cspell-words
language: en-US
ignorePaths:
  - .*
  - /*.json
  - /.vscode/
  - biome.json
  - cad/CO2-Ampel/CO2-Ampel-Flächen-V1-2-3D-BT.txt
  - cspell-words.txt
  - cspell.config.yaml
  - grafana-dashboards/*
  - LICENSE
  - package*.json
  - pnpm-lock.yaml
  - pnpm-workspace.yaml
  - pyproject.toml
  - requirements.txt
  - tests/testdata/*
  - TODO.txt
  - uv.lock
  - wiring/*
